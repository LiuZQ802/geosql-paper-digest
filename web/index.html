<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地学 SQL 文献日报</title>

<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3efe5" media="(prefers-color-scheme: light)">

<link rel="preload" href="fonts/source-serif-4-600-normal.woff2" as="font" type="font/woff2" crossorigin>

<script>

</head>
<body>

<!-- 登录 -->
<section id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-card" autocomplete="on">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="var(--accent)"/><path d="M9 31c6-1.5 9-9 15-9s9 6 15 4.5M9 22.5c4.5-1.5 7.5-7.5 13.5-7.5S33 19.5 39 18M13.5 39c4.5-1.5 9-4.5 13.5-4.5s7.5 1.5 12 0" fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>地学 SQL 文献日报</h1>
    <p class="gate-sub">内容已加密，请输入访问密码</p>
    <label class="field">
      <span class="sr-only">访问密码</span>
      <svg class="ic"><use href="#i-lock"/></svg>
      <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="访问密码" required>
    </label>
    <label class="check"><input id="remember" type="checkbox" checked> 在这台设备上记住我</label>
    <p id="gate-err" class="gate-err" role="alert" hidden></p>
    <button id="gate-btn" class="btn-primary" type="submit">进入</button>
  </form>
</section>

<!-- 主界面 -->
<div id="app" hidden>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#" data-home>
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="var(--accent)"/><path d="M9 31c6-1.5 9-9 15-9s9 6 15 4.5M9 22.5c4.5-1.5 7.5-7.5 13.5-7.5S33 19.5 39 18M13.5 39c4.5-1.5 9-4.5 13.5-4.5s7.5 1.5 12 0" fill="none" stroke="var(--paper)" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="brand-text"><b>地学 SQL 文献日报</b><small id="updated">—</small></span>
      </a>
      <div class="top-actions">
        <label class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <span class="sr-only">搜索</span>
          <input id="q" type="search" placeholder="搜索标题、解读、标签" autocomplete="off" enterkeyhint="search">
        </label>
        <button id="filter-toggle" class="icon-btn only-narrow" aria-expanded="false" aria-controls="rail" title="筛选"><svg class="ic"><use href="#i-filter"/></svg><span class="sr-only">筛选</span><span id="filter-dot" class="dot" hidden></span></button>
        <button id="theme" class="icon-btn" title="切换深浅色"><svg class="ic"><use id="theme-ic" href="#i-moon"/></svg><span class="sr-only">切换深浅色</span></button>
        <button id="logout" class="icon-btn" title="退出登录" hidden><svg class="ic"><use href="#i-out"/></svg><span class="sr-only">退出登录</span></button>
      </div>
    </div>
    <svg class="contours" viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 62c80-6 120-30 210-28s130 26 220 20 120-30 170-36"/>
      <path d="M0 48c70-4 110-26 200-24s140 22 230 14 110-26 170-30"/>
      <path d="M0 34c60-2 100-20 190-18s150 18 240 8 100-22 170-24"/>
      <path d="M260 80c10-14 40-22 80-20s60 12 70 20"/>
    </svg>
  </header>

  <div class="shell">
    <aside id="rail" class="rail">
      <nav class="views" aria-label="视图">
        <button data-view="feed" class="on">全部推荐</button>
        <button data-view="stars">收藏<span id="star-n" class="n"></span></button>
      </nav>

      <section class="rail-sec">
        <h2>研究方向</h2>
        <ul id="legend" class="legend"></ul>
      </section>

      <section class="rail-sec">
        <h2>显示</h2>
        <label class="switch"><input id="only-deep" type="checkbox"><span>只看精读</span></label>
        <label class="switch"><input id="show-zh" type="checkbox" checked><span>标题、摘要显示中文</span></label>
      </section>

      <section class="rail-sec">
        <h2>LLM 花费</h2>
        <div id="cost" class="cost"></div>
      </section>

      <section class="rail-sec only-wide">
        <h2>日期</h2>
        <ol id="dates" class="dates"></ol>
      </section>
    </aside>

    <main id="main" tabindex="-1">
      <div id="feed"></div>
      <div id="more-wrap" class="more-wrap" hidden><button id="more" class="btn-quiet">加载更早的推荐</button></div>
    </main>
  </div>

  <footer class="foot">
    <p>检索来源 arXiv · OpenAlex · Semantic Scholar。筛选与解读由 LLM 自动生成，引用前请核对原文。</p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
