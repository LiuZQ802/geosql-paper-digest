name: daily-digest

on:
  schedule:
    - cron: "0 3 * * *"    # 北京时间 11:00 兜底：本机 09:00 已经跑过就跳过（见 run_daily.ps1）
  workflow_dispatch:        # 也可以在 Actions 页面手动运行
  push:
    branches: [main]
    paths: ["web/**"]       # 只改了页面样式时，直接重新部署

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check whether the local run already happened today
        id: local
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat state/last_local_run.txt 2>/dev/null)" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "本机今天已运行，云端跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        if: github.event_name != 'push' && steps.local.outputs.skip != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          SPRINGER_META_KEY: ${{ secrets.SPRINGER_META_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TZ: Asia/Shanghai
        run: python -m scholar.main

      - name: Commit data
        if: github.event_name != 'push' && steps.local.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data state
          git diff --cached --quiet || git commit -m "digest: $(TZ=Asia/Shanghai date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
